<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CompanyX · Kế hoạch giao hàng</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f4;color:#18322c;font:16px/1.5 'Segoe UI',sans-serif}header{background:#123e35;color:white;padding:18px max(4vw,20px);display:flex;gap:28px;align-items:center}header strong{font-size:22px}nav{display:flex;gap:8px}button{cursor:pointer;border:1px solid #b2c2b9;border-radius:5px;background:white;color:#174339;padding:8px 13px;font:inherit}button.active,button.primary{background:#145e4e;color:white;border-color:#145e4e}nav button{background:transparent;color:white;border-color:#76978d}nav button.active{background:white;color:#184437}button:disabled{opacity:.5;cursor:default}main{max-width:1240px;margin:auto;padding:24px}section{background:white;padding:24px;border:1px solid #d9e3dc;border-radius:8px;margin:0 0 16px}h1{font-size:28px;margin:0 0 18px}h2{font-size:21px;margin:0 0 12px}p{margin:8px 0 16px}label{font-weight:600;display:flex;flex-direction:column;gap:5px}select,input{font:inherit;padding:8px;border:1px solid #aabbb0;border-radius:4px;min-width:0}.filters,.actions,.offers{display:flex;flex-wrap:wrap;align-items:end;gap:14px}.filters label{flex:1;min-width:160px}.line{display:grid;grid-template-columns:1fr 105px auto;gap:12px;margin:9px 0}.offers button{text-align:left;min-width:240px;padding:15px;white-space:pre-line}.offers button:first-line{font-weight:700}.msg{color:#3c6256;min-height:1.5em}.err{color:#9b371f}.scroll{max-height:420px;overflow:auto;margin-bottom:20px}table{width:100%;border-collapse:collapse}td,th{padding:8px 10px;border-bottom:1px solid #d9e3dc;text-align:left}th{background:#e8f0eb;position:sticky;top:0}iframe{width:100%;height:70vh;border:0}[hidden]{display:none!important}@media(max-width:650px){header{flex-wrap:wrap;gap:8px}main{padding:12px}section{padding:14px}.line{grid-template-columns:1fr 70px auto}}
</style><header><strong>CompanyX</strong><nav><button id="t1" class="active">Đơn giả định</button><button id="t2">So sánh ROP và MILP</button></nav></header><main>
<div id="what"><section><h1>Kiểm tra khả năng giao hàng</h1><form id="form"><div class="filters"><label>Chính sách<select id="policy"><option value="ROP">ROP · Điểm đặt hàng lại</option><option value="QUETSCHLICH_ADAPT">MILP · Tối ưu kế hoạch</option></select></label><label>Kịch bản<select id="scenario"><option value="1">S1 · Cho phép giao bù</option><option value="2">S2 · Mất đơn tại hạn giao</option></select></label><label>Ngày biết đơn<input type="date" id="known" value="2013-07-01" required></label><label>Hạn khách cần hàng<input type="date" id="due" value="2013-07-05" required></label></div>
<p id="source" class="msg"></p><h2>Sản phẩm khách đặt</h2><div id="lines"></div><div class="actions"><button type="button" id="add">+ Thêm sản phẩm</button><button class="primary" id="go" disabled>Kiểm tra giao hàng</button></div></form></section>
<section id="result" hidden><h2>Khả năng giao trọn đơn</h2><p id="status" aria-live="polite"></p><div class="offers" id="offers"></div></section><section id="detail" hidden><h2 id="detailTitle"></h2><p>Kế hoạch gồm đơn mới, các cam kết đã biết và phần bổ sung tồn theo chính sách đang chọn.</p><div id="plan"></div></section></div>
<section id="bi" hidden><h1>So sánh ROP và MILP</h1><p>Q3/2013 · Q4/2013 · Q1/2014 · Q2/2014</p><div id="report"></div></section></main>
<script>
const $=id=>document.getElementById(id), el=(tag,text)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e};let catalog,job=0,busy=false,selection=0;
async function api(path,options){const r=await fetch(path,options),j=await r.json();if(!r.ok)throw Error(j.error);return j}
function availability(){if(!catalog)return;const key=v=>v.replaceAll('-',''),x=key($('known').value),d=key($('due').value);const b=catalog.bases.filter(r=>r.policy===$('policy').value&&r.scenario===+$('scenario').value&&r.firstday<=x&&d<=r.lastday&&x<=d);$('source').textContent=b.length===1?'Đầu ngày lấy theo lượt '+b[0].id+' của chính sách đã chọn, gồm tồn kho, hàng đang làm và đơn còn chờ.':'Chưa có đúng một lượt vận hành của chính sách và kịch bản này phủ thời gian đã chọn.';$('go').disabled=busy||b.length!==1}
function add(){const row=el('div');row.className='line';const s=el('select');s.required=true;s.setAttribute('aria-label','Sản phẩm');s.add(new Option('Chọn sản phẩm…',''));for(const p of catalog.products)s.add(new Option(p.name+' · '+p.id,p.id));const q=el('input');Object.assign(q,{type:'number',min:1,step:1,required:true,value:1});q.setAttribute('aria-label','Số lượng');const rem=el('button','Bỏ');rem.type='button';rem.onclick=()=>{if($('lines').children.length>1){row.remove();invalidate()}};row.append(s,q,rem);$('lines').append(row);invalidate()}
function invalidate(){if(busy)return;++job;++selection;$('result').hidden=$('detail').hidden=true;availability()}
function lock(v){busy=v;for(const a of $('form').querySelectorAll('input,select,button'))a.disabled=v;availability()}
$('form').oninput=invalidate;$('add').onclick=add;
const fmt=s=>s.split('-').reverse().join('/');const kinds={PRODUCTION_REQUEST:'Yêu cầu sản xuất',PRODUCTION_START:'Bắt đầu sản xuất',PRODUCTION_GOOD:'Hoàn thành',BOM_ISSUE:'Xuất linh kiện'};
function table(root,title,heads,rows){root.append(el('h2',title));if(!rows.length){root.append(el('p','Không phát sinh trong phương án này.'));return}const box=el('div'),t=el('table'),h=t.createTHead().insertRow();box.className='scroll';heads.forEach(a=>h.append(el('th',a)));const body=t.createTBody();for(const row of rows){const tr=body.insertRow();row.forEach(a=>tr.append(el('td',a??'—')))}box.append(t);root.append(box)}
async function detail(id,o,button){const token=++selection;try{const d=await api('/api/order/'+id+'/plan/'+o.days);if(token!==selection)return;$('offers').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===button));$('detail').hidden=false;$('detailTitle').textContent='Kế hoạch đến '+fmt(o.date);const p=$('plan');p.replaceChildren();table(p,'Kế hoạch sản xuất chi tiết',['Ngày','Hoạt động','ProductID','Tên sản phẩm / linh kiện','Số lượng','Lệnh'],d.plan.map(r=>[fmt(r[0]),kinds[r[1]],...r.slice(2)]));table(p,'Work order đề xuất',['Lệnh mô phỏng','Ngày đề xuất','ProductID','Sản phẩm / linh kiện','Số lượng','Bắt đầu','Hoàn thành dự kiến'],d.work.map(r=>[r[0],fmt(r[1]),r[2],r[3],r[4],r[5]&&fmt(r[5]),r[6]&&fmt(r[6])]))}catch(e){$('status').textContent=e.message}}
$('form').onsubmit=async ev=>{ev.preventDefault();const token=++job;const payload={policy:$('policy').value,scenario:+$('scenario').value,known:$('known').value,due:$('due').value,lines:[...$('lines').children].map(r=>({id:+r.children[0].value,qty:+r.children[1].value}))};lock(true);$('result').hidden=false;$('detail').hidden=true;$('offers').replaceChildren();$('status').textContent='Đang lấy trạng thái đầu ngày…';try{const {id}=await api('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});while(token===job){const s=await api('/api/order/'+id);if(s.state==='error')throw Error(s.message);if(s.state==='done'){for(const o of s.offers){const b=el('button',(o.days?'Lùi '+o.days+' ngày':'Giữ hạn khách yêu cầu')+' · '+fmt(o.date)+'\n'+(o.feasible?'Giao đủ toàn đơn':'Không giao đủ toàn đơn'));b.onclick=()=>detail(id,o,b);$('offers').append(b)}if(s.offers.length===1)$('offers').append(el('span','Chưa tìm thấy hạn giao muộn khả thi đến '+fmt(s.through)+'.'));$('status').textContent='Chọn phương án để xem kế hoạch và work order. Khoảng tìm hạn muộn tối đa 14 ngày, trong kỳ dữ liệu của lượt nguồn.';break}$('status').textContent=s.message;await new Promise(r=>setTimeout(r,1400))}}catch(e){$('status').textContent=e.message}finally{lock(false)}};
function tab(show){$('what').hidden=show;$('bi').hidden=!show;$('t1').classList.toggle('active',!show);$('t2').classList.toggle('active',show)}$('t1').onclick=()=>tab(false);$('t2').onclick=async()=>{tab(true);const dest=$('report');if(dest.querySelector('iframe'))return;try{const {url}=await api('/api/report');if(url){const f=el('iframe');f.title='Báo cáo hiệu quả vận hành theo quý';f.src=url;f.allowFullscreen=true;dest.replaceChildren(f)}else dest.textContent='Báo cáo Power BI chưa được xuất bản. Khi có URL nhúng, báo cáo sẽ xuất hiện tại đây.'}catch(e){dest.textContent=e.message}};
api('/api/catalog').then(c=>{catalog=c;add();availability()}).catch(e=>$('source').textContent=e.message);
</script></html>
